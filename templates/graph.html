
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI History Graph</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f4f9;
            color: #263238;
        }

        /* Navigation */
        .navbar {
            background: #34347d;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .navbar h2 {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #ffd166;
        }

        /* Main container */
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        h1 {
            color: #34347d;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Graph */
        .graph-container {
            width: 100%;
            padding: 15px;
            background: #fafaff;
            border-radius: 12px;
            border: 1px solid #e5e5f5;
            text-align: center;
        }

        .graph-image {
            display: block;
            width: 100%;
            max-width: 850px;
            height: auto;
            margin: auto;
            border-radius: 8px;
        }

        .empty-message {
            text-align: center;
            color: #777;
            padding: 40px 15px;
            line-height: 1.7;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #5956d6;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #403db5;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media(max-width: 600px) {
            .navbar {
                flex-direction: column;
            }

            .nav-links {
                justify-content: center;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <h2>BMI Calculator</h2>

        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('history') }}">BMI History</a>
            <a href="{{ url_for('show_graph') }}">BMI Graph</a>
            <a href="{{ url_for('about') }}">About</a>
        </div>

    </nav>


    <!-- Graph Section -->
    <div class="container">

        <div class="card">

            <h1>BMI History Graph</h1>

            <p class="subtitle">
                Visual representation of saved BMI records.
                Track BMI values and compare them with reference limits.
            </p>


            <div class="graph-container">

                <img
                    src="{{ url_for('graph_image') }}"
                    alt="BMI History Graph"
                    class="graph-image"
                >

            </div>


            <a href="{{ url_for('index') }}" class="back-btn">
                Back to Calculator
            </a>

        </div>

    </div>


    <footer>
        <p>BMI Calculator | Python Flask Project | Oasis Infobyte</p>
    </footer>

</body>
</html>
