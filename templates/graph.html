<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BMI Gauge Chart</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <h2>BMI Calculator</h2>

        <div class="nav-links">

            <a href="{{ url_for('index') }}">Home</a>

            <a href="{{ url_for('dashboard') }}">Dashboard</a>

            <a href="{{ url_for('history') }}">BMI History</a>

            <a href="{{ url_for('show_graph') }}">BMI Gauge</a>

            <a href="{{ url_for('about') }}">About</a>

        </div>

    </nav>


    <!-- Graph Section -->
    <div class="container">

        <div class="card">

            <h1>BMI Gauge Chart</h1>

            <p class="subtitle">
                Your latest BMI measurement displayed on a 180° gauge.
            </p>


            <!-- Gauge and Categories -->
            <div class="gauge-layout">


                <!-- Left Side: Gauge -->
                <div class="graph-container">

                    <img
                        src="{{ url_for('graph_image') }}"
                        alt="BMI Gauge Chart"
                        class="graph-image"
                    >

                </div>


                <!-- Right Side: BMI Categories -->
                <div class="bmi-ranges">


                    <div class="range-item range-underweight">

                        <h3>Underweight</h3>

                        <p>Below 18.5</p>

                    </div>


                    <div class="range-item range-normal">

                        <h3>Normal</h3>

                        <p>18.5 – 24.9</p>

                    </div>


                    <div class="range-item range-overweight">

                        <h3>Overweight</h3>

                        <p>25 – 29.9</p>

                    </div>


                    <div class="range-item range-obese">

                        <h3>Obese</h3>

                        <p>30+</p>

                    </div>


                </div>


            </div>


            <a
                href="{{ url_for('index') }}"
                class="back-btn"
            >
                Back to Calculator
            </a>

        </div>

    </div>


    <footer>

        <p>
            BMI Calculator | Python Flask Project | Oasis Infobyte
        </p>

    </footer>

</body>

</html>
